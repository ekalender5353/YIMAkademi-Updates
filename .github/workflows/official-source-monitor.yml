name: YIM Akademi Resmi Kaynak Izleme

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: official-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: PGM degisikliklerini denetle
        id: monitor
        run: python3 scripts/monitor_official_sources.py

      - name: PDF okuma destegini kur
        if: steps.monitor.outputs.changed == 'true'
        run: python3 -m pip install --disable-pip-version-check "pypdf>=5,<7"

      - name: PGM ilan ekinden aday konu listesini hazirla
        if: steps.monitor.outputs.changed == 'true'
        id: scope
        run: python3 scripts/extract_pgm_scope.py

      - name: Izleme durumunu kaydet
        run: |
          git add .monitor/state.json
          if [ -f review/candidate-scope.json ]; then
            git add review/candidate-scope.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "yim-akademi-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "PGM izleme durumunu guncelle"
          git push

      - name: Degisiklik kaydi olustur
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .monitor/scope-extraction-report.md ]; then
            printf '\n---\n\n' >> .monitor/change-report.md
            cat .monitor/scope-extraction-report.md >> .monitor/change-report.md
          fi
          gh issue create \
            --title "PGM sınav/konu değişikliği adayı algılandı" \
            --body-file .monitor/change-report.md \
            --label "resmi-kaynak-degisikligi" || \
          gh issue create \
            --title "PGM sınav/konu değişikliği adayı algılandı" \
            --body-file .monitor/change-report.md
