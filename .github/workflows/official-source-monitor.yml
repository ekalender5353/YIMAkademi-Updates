name: YIM Akademi Resmi Kaynak Izleme

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: official-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: PGM degisikliklerini denetle
        id: monitor
        run: python3 scripts/monitor_official_sources.py

      - name: Izleme durumunu kaydet
        run: |
          git add .monitor/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "yim-akademi-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "PGM izleme durumunu guncelle"
          git push

      - name: Degisiklik kaydi olustur
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "PGM sinav veya konu degisikligi algilandi" \
            --body-file .monitor/change-report.md
