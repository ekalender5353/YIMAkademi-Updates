name: YIM Akademi Resmi Icerik Taslagi

on:
  workflow_dispatch:
  push:
    paths:
      - "review/candidate-scope.json"
      - "scripts/build_official_content_draft.py"
      - "scripts/promote_content_draft.py"
      - "scripts/compare_exam_scope.py"
      - "scripts/extract_pgm_scope.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: official-content-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: PDF okuma destegini kur
        run: python3 -m pip install --disable-pip-version-check "pypdf>=5,<7"

      - name: Resmi icerik paketi taslagini hazirla
        id: draft
        run: >-
          python3 scripts/build_official_content_draft.py
          updates/content-pack.json
          review/candidate-scope.json

      - name: Taslagi kalite denetiminden gecir
        if: steps.draft.outputs.draft_ready == 'true' && steps.draft.outputs.meaningful_change == 'true'
        run: python3 scripts/validate_content_pack.py review/content-pack.draft.json

      - name: Guvenli yayin kapisini calistir
        if: steps.draft.outputs.draft_ready == 'true' && steps.draft.outputs.meaningful_change == 'true'
        env:
          YIM_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.YIM_UPDATE_SIGNING_PRIVATE_KEY }}
        run: >-
          printf '%s' "$YIM_UPDATE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/yim-update-signing-private.pem" &&
          chmod 600 "$RUNNER_TEMP/yim-update-signing-private.pem" &&
          python3 scripts/promote_content_draft.py
          review/content-pack.draft.json review/candidate-scope.json
          updates/content-pack.json updates/manifest.json
          --signing-key "$RUNNER_TEMP/yim-update-signing-private.pem" &&
          rm -f "$RUNNER_TEMP/yim-update-signing-private.pem"

      - name: Yayin kanalini son kez dogrula
        if: steps.draft.outputs.draft_ready == 'true' && steps.draft.outputs.meaningful_change == 'true'
        run: python3 scripts/validate_release_channel.py updates/manifest.json updates/content-pack.json

      - name: Dogrulanmis paketi yayinla
        if: steps.draft.outputs.draft_ready == 'true' && steps.draft.outputs.meaningful_change == 'true'
        run: |
          if git diff --quiet -- updates/content-pack.json updates/manifest.json; then
            exit 0
          fi
          git config user.name "yim-akademi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates/content-pack.json updates/manifest.json
          git commit -m "Dogrulanmis resmi sinav kapsamını otomatik yayinla"
          git push

      - name: Taslak ve raporu sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: yim-akademi-resmi-icerik-taslagi
          path: |
            review/content-pack.draft.json
            .quality/content-draft-report.md
          if-no-files-found: warn

      - name: Guvenle derlenemeyen kapsam icin kayit ac
        if: steps.draft.outputs.draft_ready != 'true' && steps.draft.outputs.meaningful_change == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Resmi icerik otomatik yayin guvenlik kapisinda durduruldu" \
            --body-file .quality/content-draft-report.md || true
