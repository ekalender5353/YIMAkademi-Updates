name: YIM Akademi Icerik Kalite Kontrolu

on:
  workflow_dispatch:
  push:
    paths:
      - "updates/content-pack.json"
      - "updates/manifest.json"
      - "scripts/validate_content_pack.py"
      - "scripts/validate_release_channel.py"
  pull_request:
    paths:
      - "updates/content-pack.json"
      - "updates/manifest.json"
      - "scripts/validate_content_pack.py"
      - "scripts/validate_release_channel.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Icerik paketini dogrula
        run: python3 scripts/validate_content_pack.py updates/content-pack.json

      - name: Yayin kanalini dogrula
        run: python3 scripts/validate_release_channel.py updates/manifest.json updates/content-pack.json

      - name: Kalite raporunu sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: yim-akademi-icerik-kalite-raporu
          path: .quality/content-report.md
          if-no-files-found: error
